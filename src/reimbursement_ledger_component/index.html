<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body,#app{height:100%}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101936;background:transparent}.popup{height:100%;min-height:0;display:flex;flex-direction:column;padding:3px 5px 10px}.head{display:flex;align-items:center;gap:18px;margin-bottom:16px}.avatar{display:grid;place-items:center;width:65px;height:65px;border-radius:18px;background:#e2f7e8;color:#087626;font-size:34px;font-weight:800}.head h1{font-size:27px;line-height:1.15;margin:0 0 5px}.head p{margin:0;color:#475b7e;font-weight:600}.close{margin-left:auto;border:0;background:transparent;font-size:28px;color:#101936;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-bottom:20px}.stat{display:flex;align-items:center;gap:17px;border:1px solid #e2e9f7;border-radius:15px;padding:14px 18px;background:#f6f9ff}.stat.green{background:#eefaef;color:#08791e}.stat.red{background:#fff1f1;color:#c90000}.stat .symbol{display:grid;place-items:center;flex:none;width:49px;height:49px;border-radius:50%;background:#ffffff9c;font-size:26px}.stat small{display:block;font-weight:700;font-size:13px}.stat strong{display:block;margin-top:5px;font-size:26px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:12px;margin-bottom:17px}.filters input,.filters select{height:42px;border:1px solid #d9e3f5;border-radius:11px;background:#fff;box-shadow:0 2px 5px #243b670d;color:#111b37;font:inherit;padding:0 12px;width:100%}.date-field{position:relative;display:block;height:42px;color:#566889;font-size:11px;font-weight:700}.date-field span{position:absolute;left:0;bottom:calc(100% + 3px);white-space:nowrap}.date-field input{height:42px;min-width:0;font-size:12px}.wrap{flex:1;min-height:0;border:1px solid #e1e9f7;border-radius:15px;overflow-y:auto;overflow-x:hidden}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}th:nth-child(1){width:4%}th:nth-child(2){width:17%}th:nth-child(3){width:10%}th:nth-child(4){width:20%}th:nth-child(5){width:12%}th:nth-child(6){width:10%}th:nth-child(7){width:10%}th:nth-child(8){width:10%}th:nth-child(9){width:7%}th{position:sticky;top:0;z-index:1;background:linear-gradient(120deg,#edf2fa,#e6edfa);text-align:left;white-space:normal;padding:11px 6px}td{border-top:1px solid #e3eafa;padding:8px 6px;white-space:normal;overflow-wrap:anywhere}tr:first-child td{border-top:0}.check{text-align:center}input[type=checkbox]{width:17px;height:17px;accent-color:#0758f9}.ref{font-weight:700}.ref small{display:block;color:#667898;font-weight:600;margin-top:3px}.amount{text-align:center;font-weight:700}.remaining{color:#d00000}.remaining.zero{color:#077e20}.badge{display:inline-block;border-radius:30px;padding:7px 11px;font-weight:700;background:#fff0cb;color:#a64a00}.badge.partial{background:#e6efff;color:#0757d8}.badge.paid{background:#e0f7e8;color:#087520}.empty{text-align:center;color:#667898;padding:30px}.footer{flex-shrink:0;display:flex;align-items:center;gap:11px;padding-top:15px;font-weight:700}.spacer{flex:1}button{font:inherit;cursor:pointer}.footer button{height:43px;padding:0 17px;border-radius:10px;border:1px solid #dce5f6;background:white;color:#121b3a;font-weight:700}.footer button.save{border:0;background:#e1f6e7;color:#006c19}.footer button.send:disabled{border:0;background:#d6dbe4;color:#657084;cursor:not-allowed;opacity:1}.footer button:disabled{opacity:.45;cursor:not-allowed}.notice{border-radius:9px;background:#fff0f1;color:#b12234;padding:9px 12px;margin-bottom:10px}.subtle{flex-shrink:0;color:#73819e;font-size:11px;margin-top:8px}@media(max-width:760px){.head h1{font-size:19px}.avatar{width:45px;height:45px;font-size:24px}.summary{gap:5px}.stat{padding:8px;gap:4px}.stat .symbol{display:none}.stat strong{font-size:16px}.stat small{font-size:10px}.filters{grid-template-columns:1fr 1fr}.filters input[type=search]{grid-column:1/-1}.footer{flex-wrap:wrap}.spacer{display:none}.footer button{flex:1}}
</style></head><body><div id="app"></div><script>
let args={},rows=[],selected=new Set(),filters={q:'',branch:'All Branches',status:'All Statuses',from:'',to:''},busy=false,notice='',lastSignature='',lastResponse='';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'₹'+(Number(v||0)/100).toLocaleString('en-IN',{maximumFractionDigits:2});
const dateText=v=>{let d=new Date(String(v).slice(0,10)+'T12:00:00');return Number.isNaN(d.getTime())?String(v):d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
const send=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
function resize(){send('streamlit:setFrameHeight',{height:document.body.scrollHeight+12})}
function emit(action,payload={}){if(busy)return;busy=true;send('streamlit:setComponentValue',{value:{action,nonce:crypto.randomUUID(),...payload},dataType:'json'});updateFooter()}
function close(){try{let dialog=frameElement.closest('[role="dialog"]'),button=dialog.querySelector('button[aria-label="Close"]');if(button){button.click();return}}catch(e){}emit('close')}
function visible(){return rows.filter(r=>(!filters.q||[r.invoice,r.id,r.vehicle,r.route].join(' ').toLowerCase().includes(filters.q.toLowerCase()))&&(filters.branch==='All Branches'||r.branch===filters.branch)&&(filters.status==='All Statuses'||r.status===filters.status)&&(!filters.from||r.date>=filters.from)&&(!filters.to||r.date<=filters.to))}
function badge(r){return `<span class="badge ${r.status==='Cleared'?'paid':r.status==='Partially cleared'?'partial':''}">${esc(r.status)}</span>`}
function row(r){return `<tr><td class="check"><input type="checkbox" data-select="${esc(r.id)}" ${selected.has(r.id)?'checked':''} aria-label="Select ${esc(r.invoice)}"></td><td class="ref">${esc(r.invoice)}<small>${esc(r.vehicle)}</small></td><td>${dateText(r.date)}</td><td>${esc(r.route)}</td><td class="amount">${money(r.original)}</td><td class="amount">${money(r.paid)}</td><td class="amount remaining ${r.outstanding?'':'zero'}">${money(r.outstanding)}</td><td>${badge(r)}</td><td>${esc(r.branch)}</td></tr>`}
function render(){let scroll=$('.wrap')?.scrollTop||0,shown=visible(),paid=rows.reduce((s,r)=>s+r.paid,0),left=rows.reduce((s,r)=>s+r.outstanding,0),branches=[...new Set(rows.map(r=>r.branch))].sort(),kind=args.kind==='upi'?'UPI':'Billtee';$('#app').innerHTML=`<div class="popup"><header class="head"><div class="avatar">${esc(args.name?.[0]||'')}</div><div><h1>${esc(args.name)}</h1><p>${kind} Ledger</p></div><button class="close" data-action="close" aria-label="Close ledger">×</button></header><div class="summary"><div class="stat green"><span class="symbol">✓</span><div><small>Amount Cleared</small><strong>${money(paid)}</strong></div></div><div class="stat red"><span class="symbol">⌛</span><div><small>Outstanding</small><strong>${money(left)}</strong></div></div><div class="stat"><span class="symbol">♧</span><div><small>Total Trips</small><strong>${rows.length}</strong></div></div></div>${notice?`<div class="notice" role="alert">${esc(notice)}</div>`:''}<div class="filters"><input id="search" type="search" placeholder="Search by invoice no. / vehicle no. / route..." aria-label="Search trips" value="${esc(filters.q)}"><select id="branch" aria-label="Branch"><option>All Branches</option>${branches.map(b=>`<option ${filters.branch===b?'selected':''}>${esc(b)}</option>`).join('')}</select><select id="status" aria-label="Status">${['All Statuses','Pending','Partially cleared','Cleared'].map(s=>`<option ${filters.status===s?'selected':''}>${s}</option>`).join('')}</select><label class="date-field"><span>Date From</span><input id="from" type="date" value="${esc(filters.from)}"></label><label class="date-field"><span>Date To</span><input id="to" type="date" value="${esc(filters.to)}"></label></div><div class="wrap"><table><thead><tr><th class="check"><input id="all" type="checkbox" aria-label="Select all filtered trips" ${shown.length&&shown.every(r=>selected.has(r.id))?'checked':''}></th><th>Invoice No.</th><th>Trip Date</th><th>From – To</th><th>${kind} Amount (₹)</th><th>Amount Cleared (₹)</th><th>Remaining (₹)</th><th>Status</th><th>Branch</th></tr></thead><tbody>${shown.map(row).join('')||'<tr><td colspan="9" class="empty">No trips match these filters.</td></tr>'}</tbody></table></div><footer class="footer"><span id="selection-count">0 trips selected</span><span class="spacer"></span><button data-action="close">Cancel</button><button id="save" class="save" data-action="save">✓ &nbsp;Mark Selected as cleared</button><button id="send" class="send" disabled title="RTGS sending is temporarily unavailable">➤ &nbsp;Send for RTGS</button></footer><div class="subtle">Remaining reflects confirmed clearances only. RTGS requests do not change it.</div></div>`;$('.wrap').scrollTop=scroll;updateFooter();resize()}
function updateFooter(){let chosen=rows.filter(r=>selected.has(r.id));$('#selection-count').textContent=`${chosen.length} trip${chosen.length===1?'':'s'} selected`;$('#save').disabled=busy||!chosen.some(r=>r.outstanding>0);if(busy)$$('button').forEach(b=>b.disabled=true)}
document.addEventListener('input',e=>{let el=e.target;if(el.id==='search'){let pos=el.selectionStart;filters.q=el.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{let el=e.target;if(el.dataset.select){el.checked?selected.add(el.dataset.select):selected.delete(el.dataset.select);updateFooter()}else if(el.id==='all'){visible().forEach(r=>el.checked?selected.add(r.id):selected.delete(r.id));render()}else if(['branch','status','from','to'].includes(el.id)){filters[el.id]=el.value;render()}});
document.addEventListener('click',e=>{let el=e.target.closest('button');if(!el||busy)return;if(el.dataset.action==='close'){close();return}if(el.dataset.action==='save'){emit('clear_selected',{numbers:rows.filter(r=>selected.has(r.id)&&r.outstanding>0).map(r=>r.id)})}});
window.addEventListener('message',e=>{if(e.data.type!=='streamlit:render')return;args={...args,...e.data.args};rows=args.rows||[];if(args.signature!==lastSignature){lastSignature=args.signature;selected=new Set();filters.from=args.start;filters.to=args.today;busy=false}if(args.response?.error&&args.response.nonce!==lastResponse){lastResponse=args.response.nonce;notice=args.response.error;busy=false}render()});window.addEventListener('resize',resize);send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
