<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101740}.scroll{height:355px;overflow:auto;border:1px solid #e0e7fa;border-radius:14px;background:white}table{border-collapse:separate;border-spacing:0;min-width:100%;white-space:nowrap}th{position:sticky;top:0;z-index:2;background:#ebedfb;text-align:left;font-size:12px;font-weight:700;height:34px}td,th{padding:5px 12px;border-bottom:1px solid #e9edf7;border-right:1px solid #f0f2f8}td{height:30px}tr:nth-child(even){background:#fafbff}td.amount{text-align:right;font-weight:650}button{font:inherit;cursor:pointer}.badge{border:0;border-radius:20px;min-width:76px;padding:3px 13px;font-size:12px;font-weight:650;line-height:16px}.sent{background:#cef1ce;color:#176d22}.pending{background:#ffe8c7;color:#99520c}.badge:hover{box-shadow:0 0 0 2px #95b8ff}.badge:focus-visible{outline:2px solid #0069ff;outline-offset:2px}.menu{position:fixed;z-index:10;background:white;border:1px solid #dce3f5;border-radius:10px;padding:5px;box-shadow:0 5px 20px #24346030;min-width:120px}.menu button{display:block;background:transparent;border:0;padding:7px;width:100%;text-align:left;border-radius:6px}.menu button:hover{background:#eef4ff}input[type=checkbox]{accent-color:#0aaa2d;width:15px;height:15px;cursor:pointer}td input:not([type=checkbox]){font:inherit;color:inherit;border:1px solid transparent;background:transparent;width:100%;min-width:100px;padding:2px}td input:focus{outline:1px solid #076bff;background:white}.empty{padding:20px;color:#60708c}::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-thumb{background:#bac6df;border:3px solid #f6f8ff;border-radius:10px}
</style></head><body><div class="scroll" id="scroll"><table><thead></thead><tbody></tbody></table></div><script>
const send=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
let args={},rows=[],revision=null,patches=new Map(),sort=null,identity=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=c=>({'RTGS Status':'Status','Amount':'Amount (₹)','Select':''}[c]??c);
function emit(){send('streamlit:setComponentValue',{dataType:'json',value:{revision,nonce:crypto.randomUUID(),patches:[...patches.values()]}})}
function update(row,column,value){rows[row][column]=value;patches.set(row+'|'+column,{row,column,value});emit()}
function closeMenu(){document.querySelector('.menu')?.remove()}
function menu(button,row){closeMenu();const rect=button.getBoundingClientRect(),m=document.createElement('div');m.className='menu';m.setAttribute('role','menu');m.style.left=Math.min(rect.left,innerWidth-125)+'px';m.style.top=(rect.bottom+82>innerHeight?rect.top-82:rect.bottom+3)+'px';for(const [text,value] of [['Sent','RTGS Done'],['Pending','Pending']]){const b=document.createElement('button');b.textContent=text;b.setAttribute('role','menuitem');b.onclick=()=>{update(row,'RTGS Status',value);closeMenu();render()};m.append(b)}document.body.append(m);m.querySelector('button').focus()}
function render(){const box=document.getElementById('scroll'),top=box.scrollTop,left=box.scrollLeft;closeMenu();const columns=args.columns||[],editable=new Set(args.editable||[]),q=(args.search||'').trim().toLowerCase();let indices=rows.map((_,i)=>i).filter(i=>!q||Object.values(rows[i]).some(v=>String(v??'').toLowerCase().includes(q)));if(sort)indices.sort((a,b)=>String(rows[a][sort.column]??'').localeCompare(String(rows[b][sort.column]??''),undefined,{numeric:true})*sort.direction);
document.querySelector('thead').innerHTML='<tr>'+columns.map(c=>'<th data-column="'+esc(c)+'">'+(c==='Select'?'<input aria-label="Select visible rows" type="checkbox">':esc(label(c)))+'</th>').join('')+'</tr>';
document.querySelector('tbody').innerHTML=indices.map(i=>'<tr>'+columns.map(c=>{const v=rows[i][c];let content=esc(v);if(c==='RTGS Status')content='<button aria-label="Change status" aria-haspopup="menu" class="badge '+(v==='RTGS Done'?'sent':'pending')+'" data-row="'+i+'" data-status '+(!editable.has(c)?'disabled':'')+'>'+(v==='RTGS Done'?'Sent':'Pending')+'</button>';else if(c==='Select')content='<input aria-label="Select row '+(i+1)+'" type="checkbox" data-row="'+i+'" data-column="Select" '+(v?'checked':'')+'>';else if(editable.has(c))content='<input aria-label="'+esc(c)+'" data-row="'+i+'" data-column="'+esc(c)+'" '+(c==='Amount'?'type="number" min="0" step="0.01"':'type="text"')+' value="'+esc(v)+'">';else if(c==='Amount')content='₹'+Number(v||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});return '<td class="'+(c==='Amount'?'amount':'')+'">'+content+'</td>'}).join('')+'</tr>').join('')||'<tr><td colspan="'+columns.length+'" class="empty">No matching records.</td></tr>';
document.querySelectorAll('[data-status]').forEach(b=>b.onclick=e=>{e.stopPropagation();menu(b,Number(b.dataset.row))});document.querySelectorAll('tbody input').forEach(el=>el.onchange=()=>update(Number(el.dataset.row),el.dataset.column,el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):el.value));document.querySelector('thead input').onchange=e=>{indices.forEach(i=>{rows[i].Select=e.target.checked;patches.set(i+'|Select',{row:i,column:'Select',value:e.target.checked})});emit();render()};document.querySelectorAll('th[data-column]').forEach(th=>{if(th.dataset.column!=='Select')th.onclick=()=>{sort={column:th.dataset.column,direction:sort?.column===th.dataset.column?-sort.direction:1};render()}});box.scrollTop=top;box.scrollLeft=left;send('streamlit:setFrameHeight',{height:365})}
window.addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='streamlit:render')return;args=e.data.args;const fresh=revision!==args.revision;const nextIdentity=JSON.stringify(args.rows.map(r=>r.Record));const newRows=identity!==nextIdentity;identity=nextIdentity;if(fresh){revision=args.revision;patches.clear();sort=null}rows=args.rows.map(r=>({...r}));if(!fresh)for(const p of patches.values())if(rows[p.row])rows[p.row][p.column]=p.value;render();if(newRows)document.getElementById('scroll').scrollTop=1e9});document.addEventListener('click',e=>{if(!e.target.closest('.menu'))closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});document.getElementById('scroll').addEventListener('scroll',closeMenu);send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
