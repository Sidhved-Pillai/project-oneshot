<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;color:#0d173b;background:transparent}button{font:inherit;cursor:pointer}button:disabled{cursor:default;opacity:.45}.icon{width:17px;height:17px;vertical-align:middle;flex-shrink:0}.pin .icon{width:26px;height:26px}.delete .icon{margin-right:5px}.layout{display:grid;grid-template-columns:215px 1fr;gap:22px}.sidebar h3{font-size:17px;margin:15px 0}.branch{width:100%;text-align:left;border:1px solid #dce6fc;border-radius:14px;padding:15px 16px;background:#f9fbff;color:#111d44;margin-bottom:12px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 7px #165af00b}.branch.active{background:linear-gradient(110deg,#edf4ff,#d8e6ff);border-color:#bcd3ff}.branch strong{font-size:16px;display:block}.branch small{display:block;margin-top:5px;color:#40557c}.pin{color:#0063ff;font-size:24px}.branch .arrow{margin-left:auto;color:#0065ff;font-size:24px}.review{border:1px solid #dce7ff;background:linear-gradient(120deg,#fff,#f3f7ff);border-radius:20px;padding:18px;min-height:360px;max-height:530px;overflow:auto}.review h2{margin:0 0 10px;font-size:27px}.review .subtitle{font-size:15px;color:#4c6085;margin:12px 0 22px}.count{background:#dfebff;border-radius:20px;padding:7px 14px;font-size:14px;margin-left:10px}.set{border:1px solid #dce6fc;border-radius:15px;overflow:hidden;margin-bottom:20px}.set-head{background:linear-gradient(110deg,#ecf3ff,#dfe9fc);padding:12px 14px;display:flex;justify-content:space-between;gap:15px;font-size:14px;font-weight:700}.matching{font-size:12px;font-weight:400;color:#40547b}.row{display:grid;grid-template-columns:145px 1.35fr 1fr 1.25fr 1.5fr 1fr;gap:12px;align-items:center;padding:14px 12px;border-bottom:1px solid #e5edfc;font-size:13px;background:#f8fbff}.original{background:linear-gradient(110deg,#f4fff4,#f0fbf6)}.row label{display:flex;align-items:center;gap:8px;cursor:pointer}.row input{width:22px;height:22px;accent-color:#0060ff;margin:0}.badge{background:#e0ebff;color:#0045ce;border-radius:20px;padding:7px 10px;display:inline-block;font-weight:600}.original .badge{background:#e2f8df;color:#197512}.cell small{display:block;font-size:11px;color:#4c6085;margin-bottom:8px}.cell{overflow-wrap:anywhere}.cell strong{font-size:12px}.meta{padding:7px 14px 12px;color:#52658a;background:#fbfdff;font-size:11px}.footer{border-top:1px solid #dfe8fc;margin-top:20px;padding:18px 0 2px;display:flex;gap:15px;align-items:center}.selection{margin-right:auto;color:#273d6d}.cancel,.delete{padding:12px 24px;border-radius:28px;border:1px solid #d2dffb;background:#fff;color:#111c47;font-weight:600;box-shadow:0 3px 7px #165af014}.delete{background:linear-gradient(110deg,#1687ff,#0050ff);color:white;border:0}.notice{background:#edf5ff;padding:12px;border-radius:12px;color:#455d85;font-size:13px;margin-bottom:18px}
@media(max-width:750px){.layout{grid-template-columns:1fr;gap:10px}.sidebar{display:flex;gap:8px;overflow-x:auto;align-items:center}.sidebar h3{display:none}.branch{min-width:130px;width:auto;margin:0;padding:10px}.pin{display:none}.review{padding:10px;max-height:500px}.review h2{font-size:23px}.row{grid-template-columns:120px 1fr;gap:12px}.set-head{display:block}.matching{display:block;margin-top:8px}.footer{flex-wrap:wrap;gap:8px}.selection{width:100%;font-size:14px}.cancel,.delete{padding:12px 16px}.notice{font-size:12px}}
</style></head><body><div id="app"></div><script>
let groups=[], selected=new Set(), branch='', lastSignature='', sending=false;
const paths={pin:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 11h18"/>',truck:'<path d="M2 5h12v13H2zM14 10h4l4 5v3h-8"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/>',trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/>'};
const icon=name=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[name]}</svg>`;

const escapeHtml=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const message=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
function resize(){message('streamlit:setFrameHeight',{height:Math.min(850,document.body.scrollHeight+10)})}
function emit(value){message('streamlit:setComponentValue',{value,dataType:'json'})}
function count(){const n=selected.size;const text=document.querySelector('.selection');if(text)text.textContent=`☑ ${n} duplicate(s) selected`;const button=document.querySelector('.delete');if(button){button.innerHTML=icon('trash')+` Delete Selected (${n})`;button.disabled=!n||sending}}
function rowHtml(row, original){return `<div class="row ${original?'original':''}"><div>${original?'<span class="badge">✓ Original (Keep)</span>':`<label><input type="checkbox" data-id="${escapeHtml(row.number)}" ${selected.has(row.number)?'checked':''}><span class="badge">Duplicate</span></label>`}</div><div class="cell"><strong>${escapeHtml(row.number)}</strong></div><div class="cell"><small>${icon('calendar')} Date</small>${escapeHtml(row.date)}</div><div class="cell"><small>${icon('truck')} Vehicle</small>${escapeHtml(row.vehicle)}</div><div class="cell"><small>${icon('pin')} From – To</small>${escapeHtml(row.route)}</div><div class="cell"><small>${row.expense?'Amount':'Revenue'}</small><strong>${escapeHtml(row.amount)}</strong></div></div><div class="meta">${escapeHtml(row.expense?'Direct Expense · '+row.heading+' · Beneficiary: '+row.beneficiary:'LR: '+row.lr+' · Invoice: '+row.invoice)} · Branch: ${escapeHtml(row.branch)} · Created by ${escapeHtml(row.creator)} · Saved: ${escapeHtml(row.created)}</div>`}
function render(){const branches=[...new Set(groups.map(g=>g.branch))];if(!branches.includes(branch))branch=branches[0]||'';const current=groups.filter(g=>g.branch===branch);const copies=current.reduce((n,g)=>n+g.duplicates.length,0);document.getElementById('app').innerHTML=`<div class="notice">Only selected redundant copies are deleted. Originals are protected. Deleted records remain recoverable.</div><div class="layout"><aside class="sidebar"><h3>By Branch</h3>${branches.map(b=>`<button class="branch ${b===branch?'active':''}" data-branch="${escapeHtml(b)}"><span class="pin">${icon('pin')}</span><span><strong>${escapeHtml(b)}</strong><small>${groups.filter(g=>g.branch===b).reduce((n,g)=>n+g.duplicates.length,0)} duplicates</small></span><span class="arrow">›</span></button>`).join('')}</aside><main class="review"><h2>${escapeHtml(branch||'No duplicates')} <span class="count">${copies} ${copies===1?'Copy':'Copies'}</span></h2><p class="subtitle">Potential duplicates found across ${current.length} record sets.</p>${current.map((g,i)=>`<section class="set"><div class="set-head"><span>◉ Duplicate Set ${i+1} (${g.duplicates.length+1} Entries)</span><span class="matching">Matching: ${escapeHtml(g.reason)}</span></div>${rowHtml(g.original,true)}${g.duplicates.map(r=>rowHtml(r,false)).join('')}</section>`).join('')}</main></div><div class="footer"><span class="selection"></span><button class="cancel">Cancel</button><button class="delete" ${sending?'disabled':''}>Delete Selected</button></div>`;
document.querySelectorAll('[data-branch]').forEach(b=>b.onclick=()=>{branch=b.dataset.branch;render()});document.querySelectorAll('input[data-id]').forEach(box=>box.onchange=()=>{if(box.checked)selected.add(box.dataset.id);else selected.delete(box.dataset.id);count()});document.querySelector('.cancel').onclick=()=>{const dialog=window.parent.document.querySelector('[role=dialog]');const close=dialog?.querySelector('button[aria-label=Close]');if(close)close.click();else emit({action:'cancel',nonce:Date.now()})};document.querySelector('.delete').onclick=()=>{sending=true;count();emit({action:'delete',numbers:[...selected],nonce:Date.now()})};count();resize()}
window.addEventListener('message',event=>{if(event.source!==window.parent||event.data.type!=='streamlit:render')return;const args=event.data.args||{};groups=args.groups||[];if(args.signature!==lastSignature){selected=new Set();lastSignature=args.signature;sending=false}render()});window.addEventListener('resize',resize);message('streamlit:componentReady',{apiVersion:1});
</script></body></html>
