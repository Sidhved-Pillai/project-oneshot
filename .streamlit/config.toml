[theme]
base = "light"
primaryColor = "#7C3AED"
backgroundColor = "#FAF9FC"
secondaryBackgroundColor = "#F2EEF8"
textColor = "#17151C"
font = "sans-serif"

[server]
headless = true
# Retain in-progress widget values/uploads while a phone is in another app.
disconnectedSessionTTL = 1800

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
