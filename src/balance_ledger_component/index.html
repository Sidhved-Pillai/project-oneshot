</style></head><body><div id="app"></div><script>
let args={},rows=[],history=[],batches=[],tab='trips',selected=new Set(),drafts={},filters={query:'',branch:'All Branches',status:'All Statuses',from:'',to:''},lastSig='',busy=false,notice='',lastResponse='';
const $=s=>document.querySelector(s);const $$=s=>Array.from(document.querySelectorAll(s));
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'₹'+(Number(v||0)/100).toLocaleString('en-IN',{maximumFractionDigits:2});
const dateText=v=>{const d=new Date(String(v).slice(0,10)+'T12:00:00');return Number.isNaN(d.getTime())?String(v):d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
const paths={coins:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 4 16 4 16 0V6M4 12c0 4 16 4 16 0"/>',check:'<path d="m5 12 4 4L19 6"/>',hourglass:'<path d="M6 2h12M6 22h12M7 2v5l10 10v5M17 2v5L7 17v5"/>',truck:'<path d="M2 5h12v13H2zM14 10h4l4 5v3h-8"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/>',send:'<path d="m3 3 18 9-18 9 4-9-4-9Zm4 9h14"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 11h18"/>',close:'<path d="m5 5 14 14M19 5 5 19"/>'};
const icon=name=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[name]||paths.coins}</svg>`;
const send=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
function resize(){send('streamlit:setFrameHeight',{height:document.body.scrollHeight+12})}
function emit(action,values={}){if(busy)return;busy=true;send('streamlit:setComponentValue',{value:{action,nonce:crypto.randomUUID(),...values},dataType:'json'});updateFooter()}
function closeLedger(){try{const dialog=window.frameElement.closest('[role="dialog"]');const close=dialog.querySelector('button[aria-label="Close"]');if(close){close.click();return}}catch(_){}emit('close')}
function guardDismiss(){try{const host=window.parent,doc=host.document,dialog=window.frameElement.closest('[role="dialog"]');if(!dialog||window.dismissGuard)return;const guard=new host.AbortController();window.dismissGuard=guard;function outside(e){if(!dialog.isConnected){guard.abort();return}if(dialog.contains(e.target))return;e.preventDefault();e.stopImmediatePropagation()}for(const type of ['pointerdown','mousedown','mouseup','click','touchstart','touchend'])doc.addEventListener(type,outside,{capture:true,passive:false,signal:guard.signal});doc.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation()}},{capture:true,signal:guard.signal});const observer=new host.MutationObserver(()=>{if(!dialog.isConnected){guard.abort();observer.disconnect()}});observer.observe(doc.body,{childList:true,subtree:true});guard.signal.addEventListener('abort',()=>observer.disconnect(),{once:true})}catch(_){}}
function cents(value){const n=Number(value);return value===''?0:Number.isFinite(n)&&Number.isSafeInteger(Math.round(n*100))?Math.round(n*100):NaN}
function preview(row){const value=drafts[row.id]??0;const remaining=row.outstanding-value;return {value,remaining,status:remaining<=0?'Cleared':row.paid+value>0?'Partially Paid':'Pending',invalid:!Number.isFinite(value)||value<0||value>row.outstanding}}
function badge(status){return `<span class="badge ${status==='Cleared'?'cleared':status==='Partially Paid'||status==='Partially cleared'?'partial':status==='Reversed'?'reversed':''}">${status==='Cleared'?'✓ ':''}${escapeHtml(status==='Partially Paid'?'Partially cleared':status)}</span>`}
function visibleRows(){return rows.filter(r=>{const p=preview(r);return (!filters.query||[r.id,r.invoice,r.vehicle,r.route].join(' ').toLowerCase().includes(filters.query.toLowerCase()))&&(filters.branch==='All Branches'||r.branch===filters.branch)&&(filters.status==='All Statuses'||(r.status==='Partially Paid'?'Partially cleared':r.status)===filters.status)&&(!filters.from||r.date>=filters.from)&&(!filters.to||r.date<=filters.to)})}
function header(){const total=rows.reduce((s,r)=>s+r.original,0),paid=rows.reduce((s,r)=>s+r.paid,0),left=rows.reduce((s,r)=>s+r.outstanding,0);return `<header class="header"><div class="avatar">${escapeHtml(args.name?.[0]||'')}</div><div><h1>Update in Ledger – ${escapeHtml(args.name)}</h1><p>Review trips, clear selected balances and send for RTGS.</p></div><button class="close" data-action="close" title="Close ledger" aria-label="Close ledger">${icon('close')}</button></header><div class="summary">${[['coins','Total Freight',money(total)],['check','Total Paid',money(paid)],['hourglass','Outstanding',money(left)],['truck','Total Trips',rows.length]].map(([i,label,value])=>`<div class="stat"><div class="stat-icon">${icon(i)}</div><div><small>${label}</small><strong>${value}</strong></div></div>`).join('')}</div><nav class="tabs">${[['trips',`Trips (${rows.length})`],['history','Payment History'],['batches','RTGS Batches']].map(([id,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}">${label}</button>`).join('')}</nav>`}
function filtersHtml(){const branches=[...new Set(rows.map(r=>r.branch))].sort();return `<div class="filters"><input id="search" type="search" placeholder="Search by invoice no. / vehicle no. / route…" aria-label="Search trips" value="${escapeHtml(filters.query)}"><select id="branch" aria-label="Branch"><option>All Branches</option>${branches.map(b=>`<option ${filters.branch===b?'selected':''}>${escapeHtml(b)}</option>`).join('')}</select><select id="status" aria-label="Status">${['All Statuses','Pending','Partially cleared','Cleared'].map(v=>`<option ${filters.status===v?'selected':''}>${v}</option>`).join('')}</select><label class="date-field"><span>Date From</span><input id="from" type="date" value="${escapeHtml(filters.from)}"></label><label class="date-field"><span>Date To</span><input id="to" type="date" value="${escapeHtml(filters.to)}"></label></div>`}
function rowHtml(r){const p=preview(r);return `<tr data-row="${escapeHtml(r.id)}"><td class="check"><input type="checkbox" data-select="${escapeHtml(r.id)}" ${selected.has(r.id)?'checked':''} aria-label="Select ${escapeHtml(r.invoice)}"></td><td class="ref" title="${escapeHtml(r.id)}">${escapeHtml(r.invoice)}<div class="reference">${escapeHtml(r.vehicle)}</div></td><td>${dateText(r.date)}</td><td class="route">${escapeHtml(r.route)}</td><td class="amount">${money(r.original)}</td><td class="amount paid">${money(r.paid)}</td><td class="amount remaining ${p.remaining?'red':'paid'}">${money(p.remaining)}</td><td class="status-cell">${badge(p.status)}</td></tr>`}
function tripsHtml(){const shown=visibleRows();return `${filtersHtml()}<div class="table-wrap"><table class="trip-table"><thead><tr><th class="check"><input id="all" type="checkbox" aria-label="Select filtered trips" ${shown.length&&shown.every(r=>selected.has(r.id))?'checked':''}></th><th>Invoice No.</th><th>Trip Date</th><th>From – To</th><th>Freight (BP)</th><th>Amount Cleared (₹)</th><th>Remaining</th><th>Status</th></tr></thead><tbody>${shown.map(rowHtml).join('')||'<tr><td colspan="8" class="empty">No trips match these filters.</td></tr>'}</tbody></table></div><div class="draft-summary" id="draft-summary"></div><footer class="footer"><button id="send" class="green rtgs-locked" data-action="send" disabled title="RTGS sending is temporarily unavailable">${icon('send')}Send Selected for RTGS</button><span class="spacer"></span><button data-action="close">Cancel</button><button id="save" class="blue" data-action="save">${icon('check')}Mark Selected as cleared</button></footer><div class="note" id="note"></div>`}
function allocationsTable(allocations){const byId=new Map(rows.map(r=>[r.id,r]));return `<div class="table-wrap"><table class="trip-table"><thead><tr><th>Record / Trip</th><th>Trip Date</th><th>Paid Amount</th><th>Current Outstanding</th><th>Current Status</th></tr></thead><tbody>${allocations.map(a=>{const r=byId.get(a.id);return `<tr><td>${escapeHtml(r?.invoice||a.id)}</td><td>${r?dateText(r.date):'—'}</td><td class="paid">${money(a.amount)}</td><td class="red">${r?money(r.outstanding):'—'}</td><td>${r?badge(r.status):'—'}</td></tr>`}).join('')}</tbody></table></div>`}
function historyHtml(){return `<div class="history-list">${history.map(p=>`<details class="history-card"><summary><strong>${dateText(p.date)}</strong><strong class="${p.amount<0?'red':'paid'}">${money(p.amount)}</strong><span>${escapeHtml(p.user)}</span>${badge(p.correctionOf?'Correction':p.reversed?'Reversed':'Payment Recorded')}</summary><section><div class="reference">${escapeHtml(p.id)}${p.correctionOf?' · Correction of '+escapeHtml(p.correctionOf):''}</div><p>${escapeHtml(p.reference||'No reference provided')}</p>${allocationsTable(p.allocations)}${!p.correctionOf&&!p.reversed?`<details><summary class="correct">Correct this payment</summary><p class="note">Use this only to correct a mistaken ledger record. The original is retained in history. This does not reverse a bank transfer. After reversal, enter the correct amount in Trips.</p><div class="history-action"><input data-reason="${escapeHtml(p.id)}" placeholder="Reason for correction" aria-label="Correction reason"><button class="correct" data-reverse="${escapeHtml(p.id)}">Confirm Reversal</button></div></details>`:''}</section></details>`).join('')||'<div class="empty">No payments or corrections have been recorded for this transporter.</div>'}</div><footer class="footer"><span class="note">All saved payments and corrections retain who recorded them and when.</span><span class="spacer"></span><button data-action="close">Close</button></footer>`}
function batchesHtml(){return `<div class="history-list">${batches.map(b=>{const total=b.rows.reduce((s,r)=>s+r.amount,0),paid=b.rows.reduce((s,r)=>s+r.confirmed,0),left=total-paid;return `<details class="history-card"><summary><strong>${escapeHtml(b.id)}</strong><span>${money(total)} · ${b.rows.length} trips</span>${badge(left<=0?'Cleared':paid?'Partially Paid':'Awaiting Confirmation')}</summary><section><div class="reference">Sent ${dateText(b.date)} · Requested by ${escapeHtml(b.user)}</div><div class="table-wrap"><table class="trip-table"><thead><tr><th>Record / Trip</th><th>Requested</th><th>Confirmed Paid</th><th>Remaining</th></tr></thead><tbody>${b.rows.map(r=>`<tr><td>${escapeHtml(r.id)}</td><td>${money(r.amount)}</td><td class="paid">${money(r.confirmed)}</td><td class="red">${money(r.amount-r.confirmed)}</td></tr>`).join('')}</tbody></table></div>${left>0?`<div class="history-action"><input type="date" data-batch-date="${escapeHtml(b.id)}" max="${escapeHtml(args.today)}" value="${escapeHtml(args.today)}" aria-label="Actual bank payment date"><label><input type="checkbox" data-confirm="${escapeHtml(b.id)}"> I confirm this remaining ${money(left)} has actually been paid.</label><button class="green" data-confirm-batch="${escapeHtml(b.id)}">Confirm Actual Payment</button></div>`:''}</section></details>`}).join('')||'<div class="empty">No RTGS batches have been sent for these trips.</div>'}</div><footer class="footer"><span class="note">Sending or downloading an RTGS report never records an actual payment here.</span><span class="spacer"></span><button data-action="close">Close</button></footer>`}
function updateFooter(){if(tab!=='trips')return;const chosen=rows.filter(r=>selected.has(r.id)),value=chosen.reduce((s,r)=>s+(drafts[r.id]||0),0),invalid=chosen.some(r=>preview(r).invalid),total=chosen.reduce((s,r)=>s+r.original,0),paid=chosen.reduce((s,r)=>s+r.paid+(drafts[r.id]||0),0),remaining=chosen.reduce((s,r)=>s+preview(r).remaining,0),eligible=chosen.filter(r=>r.sendable>0&&r.bankReady);if($('#draft-summary'))$('#draft-summary').innerHTML=`<span>${chosen.length} trip${chosen.length===1?'':'s'} selected</span><span>Total Freight: <strong>${money(total)}</strong></span><span>Amount Cleared: <strong class="paid">${money(paid)}</strong></span><span>Remaining: <strong class="${remaining?'red':'paid'}">${money(remaining)}</strong></span>`;if($('#save'))$('#save').disabled=busy||!chosen.some(r=>r.outstanding>0);if($('#send'))$('#send').disabled=true;if($('#note'))$('#note').textContent='Send for RTGS is temporarily unavailable.';$$('button').forEach(b=>{if(busy)b.disabled=true})}
function render(){const scroll=$('.table-wrap')?.scrollTop||0;$('#app').innerHTML=`<div class="popup">${header()}${notice?`<div class="notice" role="alert">${escapeHtml(notice)}</div>`:''}${tab==='trips'?tripsHtml():tab==='history'?historyHtml():batchesHtml()}</div>`;if($('.table-wrap'))$('.table-wrap').scrollTop=scroll;updateFooter();resize()}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.payment){const id=el.dataset.payment;drafts[id]=cents(el.value);if(drafts[id]>0)selected.add(id);const r=rows.find(r=>r.id===id),p=preview(r),tr=el.closest('tr');el.classList.toggle('invalid',p.invalid);tr.querySelector('[data-select]').checked=selected.has(id);tr.querySelector('.remaining').textContent=money(p.remaining);tr.querySelector('.remaining').className='amount remaining '+(p.remaining?'red':'paid');tr.querySelector('.status-cell').innerHTML=badge(p.status);updateFooter();return}if(el.id==='search'){const pos=el.selectionStart;filters.query=el.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}if(el.id==='reference')args.reference=el.value;if(el.id==='payment-date')args.paymentDate=el.value});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.select){el.checked?selected.add(el.dataset.select):selected.delete(el.dataset.select);updateFooter()}else if(el.id==='all'){visibleRows().forEach(r=>el.checked?selected.add(r.id):selected.delete(r.id));render()}else if(['branch','status','from','to'].includes(el.id)){filters[el.id]=el.value;render()}});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||busy)return;if(el.dataset.tab){tab=el.dataset.tab;notice='';render();return}if(el.dataset.action==='close'){closeLedger();return}if(el.dataset.action==='save'){emit('clear_selected',{numbers:rows.filter(r=>selected.has(r.id)&&r.outstanding>0).map(r=>r.id)});return}if(el.dataset.action==='send'){emit('send',{numbers:rows.filter(r=>selected.has(r.id)&&r.sendable>0&&r.bankReady).map(r=>r.id)});return}if(el.dataset.reverse){const id=el.dataset.reverse;const reason=$$('[data-reason]').find(x=>x.dataset.reason===id)?.value.trim();if(!reason){notice='Enter a reason for the correction.';render();return}emit('reverse',{paymentId:id,reason});return}if(el.dataset.confirmBatch){const id=el.dataset.confirmBatch;const paid=$$('[data-confirm]').find(x=>x.dataset.confirm===id)?.checked;const date=$$('[data-batch-date]').find(x=>x.dataset.batchDate===id)?.value;if(!paid){notice='Confirm actual bank payment before recording it.';render();return}emit('confirm',{batchId:id,paymentDate:date,actuallyPaid:true})}});
window.addEventListener('message',e=>{if(e.data.type!=='streamlit:render')return;const incoming=e.data.args;args={...args,...incoming};rows=args.rows||[];history=args.history||[];batches=args.batches||[];if(args.signature!==lastSig){lastSig=args.signature;selected=new Set();drafts={};filters.from=args.start;filters.to=args.today;busy=false}if(args.response?.error&&args.response.nonce!==lastResponse){lastResponse=args.response.nonce;notice=args.response.error;busy=false}guardDismiss();render()});
window.addEventListener('resize',resize);document.addEventListener('toggle',resize,true);send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
