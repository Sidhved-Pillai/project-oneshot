<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101740}.scroll{height:355px;overflow:auto;border:1px solid #e0e7fa;border-radius:14px;background:white}table{border-collapse:separate;border-spacing:0;min-width:100%;white-space:nowrap}th{position:sticky;top:0;z-index:2;background:#ebedfb;text-align:left;font-size:12px;font-weight:700;height:34px}td,th{padding:5px 12px;border-bottom:1px solid #e9edf7;border-right:1px solid #f0f2f8}td{height:30px}tr:nth-child(even){background:#fafbff}td.amount{text-align:right;font-weight:650}button{font:inherit;cursor:pointer}.badge{border:0;border-radius:20px;min-width:76px;padding:3px 13px;font-size:12px;font-weight:650;line-height:16px}.sent{background:#cef1ce;color:#176d22}.pending{background:#ffe8c7;color:#99520c}.badge:hover{box-shadow:0 0 0 2px #95b8ff}.badge:focus-visible{outline:2px solid #0069ff;outline-offset:2px}.menu{position:fixed;z-index:10;background:#fff;border:1.5px solid #8acfff;border-radius:13px;padding:6px;box-shadow:0 5px 18px #24346025;width:160px}.menu:before{content:"";position:absolute;top:var(--pointer-top,24px);left:-7px;width:12px;height:12px;background:white;border-left:1.5px solid #8acfff;border-bottom:1.5px solid #8acfff;transform:rotate(45deg)}.menu.left:before{left:auto;right:-7px;transform:rotate(225deg)}.menu button{display:flex;align-items:center;gap:11px;background:transparent;border:0;padding:9px 10px;width:100%;text-align:left;border-radius:9px;font-weight:650;color:#16203b}.menu button:hover,.menu button:focus-visible{background:#f0f6ff;outline:none}.menu button.current{background:#fff3e6;color:#874617}.menu button.current[data-value="RTGS Done"]{background:#ebf9ed;color:#176d22}.menu svg{width:21px;height:21px;flex:none}.menu .sent-icon{color:#12af37}.menu .pending-icon{color:#f58b1f}input[type=checkbox]{accent-color:#0aaa2d;width:15px;height:15px;cursor:pointer}td input:not([type=checkbox]){font:inherit;color:inherit;border:1px solid transparent;background:transparent;width:100%;min-width:100px;padding:2px}td input:focus{outline:1px solid #076bff;background:white}.empty{padding:20px;color:#60708c}::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-thumb{background:#bac6df;border:3px solid #f6f8ff;border-radius:10px}
</style><link rel="stylesheet" href="scrollbars.css"><style>.grid-shell{position:relative;padding:0 20px 20px 0}.scroll{overflow:scroll;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}</style></head><body><div class="grid-shell" id="grid-shell"><div class="scroll" id="scroll"><table><thead></thead><tbody></tbody></table></div></div><script src="scrollbars.js"></script><script src="scrollbars.js"></script><script>
const send=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
let args={},rows=[],revision=null,patches=new Map(),sort=null,identity=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=c=>({'RTGS Status':'Status','Amount':'Amount (₹)','Select':''}[c]??c);
function emit(){send('streamlit:setComponentValue',{dataType:'json',value:{revision,nonce:crypto.randomUUID(),patches:[...patches.values()]}})}
function update(row,column,value){rows[row][column]=value;patches.set(row+'|'+column,{row,column,value});emit()}
let menuAnchor=null;
function closeMenu(){document.querySelector('.menu')?.remove();menuAnchor=null}
function positionMenu(){
 const m=document.querySelector('.menu'),button=menuAnchor;
 if(!m||!button)return;
 const r=button.getBoundingClientRect(),bounds=document.getElementById('scroll').getBoundingClientRect();
 if(r.bottom<=bounds.top+34||r.top>=bounds.bottom||r.right<=bounds.left||r.left>=bounds.right){closeMenu();return}
 const w=m.offsetWidth,h=m.offsetHeight,gap=10,pad=8;
 const leftSide=r.right+gap+w>innerWidth-pad;
 const x=leftSide?r.left-gap-w:r.right+gap;
 const y=Math.max(pad,Math.min(r.top+r.height/2-h/2,innerHeight-h-pad));
 m.classList.toggle('left',leftSide);
 m.style.left=Math.max(pad,Math.min(x,innerWidth-w-pad))+'px';m.style.top=y+'px';
 m.style.setProperty('--pointer-top',Math.max(12,Math.min(r.top+r.height/2-y-6,h-24))+'px');
}
function menu(button,row){
 closeMenu();menuAnchor=button;
 const m=document.createElement('div');m.className='menu';m.setAttribute('role','menu');m.setAttribute('aria-label','RTGS status');
 for(const [text,value] of [['Sent','RTGS Done'],['Pending','Pending']]){
  const b=document.createElement('button');b.dataset.value=value;
  const current=rows[row]['RTGS Status']===value;
  b.classList.toggle('current',current);b.setAttribute('role','menuitemradio');b.setAttribute('aria-checked',String(current));
  b.innerHTML=(value==='RTGS Done'?'<svg class="sent-icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="11"/><path d="m7 12 3 3 7-7" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>':'<svg class="pending-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2" stroke-linecap="round" stroke-linejoin="round"/></svg>')+'<span>'+text+'</span>';
  b.onclick=()=>{update(row,'RTGS Status',value);closeMenu();render()};m.append(b);
 }
 document.body.append(m);positionMenu();m.querySelector('button').focus({preventScroll:true});
}
function render(){const box=document.getElementById('scroll'),top=box.scrollTop,left=box.scrollLeft;closeMenu();const columns=args.columns||[],editable=new Set(args.editable||[]),q=(args.search||'').trim().toLowerCase();let indices=rows.map((_,i)=>i).filter(i=>!q||Object.values(rows[i]).some(v=>String(v??'').toLowerCase().includes(q)));if(sort)indices.sort((a,b)=>String(rows[a][sort.column]??'').localeCompare(String(rows[b][sort.column]??''),undefined,{numeric:true})*sort.direction);
document.querySelector('thead').innerHTML='<tr>'+columns.map(c=>'<th data-column="'+esc(c)+'">'+(c==='Select'?'<input aria-label="Select visible rows" type="checkbox">':esc(label(c)))+'</th>').join('')+'</tr>';
document.querySelector('tbody').innerHTML=indices.map(i=>'<tr>'+columns.map(c=>{const v=rows[i][c];let content=esc(v);if(c==='RTGS Status')content='<button aria-label="Change status" aria-haspopup="menu" class="badge '+(v==='RTGS Done'?'sent':'pending')+'" data-row="'+i+'" data-status '+(!editable.has(c)?'disabled':'')+'>'+(v==='RTGS Done'?'Sent':'Pending')+'</button>';else if(c==='Select')content='<input aria-label="Select row '+(i+1)+'" type="checkbox" data-row="'+i+'" data-column="Select" '+(v?'checked':'')+'>';else if(editable.has(c))content='<input aria-label="'+esc(c)+'" data-row="'+i+'" data-column="'+esc(c)+'" '+(c==='Amount'?'type="number" min="0" step="0.01"':'type="text"')+' value="'+esc(v)+'">';else if(c==='Amount')content='₹'+Number(v||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});return '<td class="'+(c==='Amount'?'amount':'')+'">'+content+'</td>'}).join('')+'</tr>').join('')||'<tr><td colspan="'+columns.length+'" class="empty">No matching records.</td></tr>';
document.querySelectorAll('[data-status]').forEach(b=>b.onclick=e=>{e.stopPropagation();menu(b,Number(b.dataset.row))});document.querySelectorAll('tbody input').forEach(el=>el.onchange=()=>update(Number(el.dataset.row),el.dataset.column,el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):el.value));document.querySelector('thead input').onchange=e=>{indices.forEach(i=>{rows[i].Select=e.target.checked;patches.set(i+'|Select',{row:i,column:'Select',value:e.target.checked})});emit();render()};document.querySelectorAll('th[data-column]').forEach(th=>{if(th.dataset.column!=='Select')th.onclick=()=>{sort={column:th.dataset.column,direction:sort?.column===th.dataset.column?-sort.direction:1};render()}});box.scrollTop=top;box.scrollLeft=left;send('streamlit:setFrameHeight',{height:380})}
window.addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='streamlit:render')return;args=e.data.args;const fresh=revision!==args.revision;const nextIdentity=JSON.stringify(args.rows.map(r=>r.Record));const newRows=identity!==nextIdentity;identity=nextIdentity;if(fresh){revision=args.revision;patches.clear();sort=null}rows=args.rows.map(r=>({...r}));if(!fresh)for(const p of patches.values())if(rows[p.row])rows[p.row][p.column]=p.value;render();if(newRows)document.getElementById('scroll').scrollTop=1e9});document.addEventListener('click',e=>{if(!e.target.closest('.menu'))closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});document.getElementById('scroll').addEventListener('scroll',positionMenu);window.addEventListener('resize',positionMenu);installReportScrollbars(document.getElementById('grid-shell'),document.getElementById('scroll'));send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
